
name: Compilazione iOS MAUI

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Installa .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Installa i workload MAUI
        run: dotnet workload install maui-ios android maccatalyst

      - name: Seleziona Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Compila MauiApp1 per iOS
        run: |
          dotnet build MauiApp1/MauiApp1.csproj \
            -f net10.0-ios \
            -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableCodeSigning=false \
            -p:ArchiveOnBuild=false

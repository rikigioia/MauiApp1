
name: Compilazione iOS MAUI

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Installa .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.203'

      - name: Installa i workload MAUI
        run: dotnet workload install maui-ios android maccatalyst --skip-manifest-update
      
      - name: Mostra le versioni dei workload
        run: |
          dotnet --info
          dotnet workload list

      - name: Configura Xcode 26.0.1
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer

          echo "=== Versione Xcode ==="
          xcodebuild -version

          echo "=== Percorso Xcode ==="
          xcode-select -p

          echo "=== Verifica SDK macOS ==="
          xcrun --sdk macosx --show-sdk-path

          echo "=== Verifica actool ==="
          xcrun --find actool

      - name: Verifica SDK macOS
        run: |
          echo "SDK macOS:"
          xcrun --sdk macosx --show-sdk-path

          echo "SDK iOS:"
          xcrun --sdk iphoneos --show-sdk-path

          echo "Verifica presenza SDK macOS:"
          ls -la /Applications/Xcode_26.0.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/

      - name: Compila MauiApp1 per iOS
        run: |
          dotnet build MauiApp1/MauiApp1.csproj \
            -f net10.0-ios \
            -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableCodeSigning=false \
            -p:ArchiveOnBuild=false

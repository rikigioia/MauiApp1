
name: Compilazione iOS MAUI

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Installa .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.203'

      - name: Installa i workload MAUI
        run: dotnet workload install maui-ios android maccatalyst --skip-manifest-update
      
      - name: Mostra le versioni dei workload
        run: |
          dotnet --info
          dotnet workload list

      - name: Seleziona e verifica Xcode 26.0
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
          xcodebuild -version
          xcode-select -p
          xcodebuild -showsdks
          xcrun --find actool
          xcrun --sdk macosx --show-sdk-path

      - name: Compila MauiApp1 per iOS
        run: |
          dotnet build MauiApp1/MauiApp1.csproj \
            -f net10.0-ios \
            -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableCodeSigning=false \
            -p:ArchiveOnBuild=false
